name: Custom Files Build (Pretendard)
run-name: Personal Files Release x64
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/custom-build.yml'
      - '.github/scripts/Generate-SelfCertPfx.ps1'
      - '.github/scripts/Install-FilesDev-Package.ps1'
      - '.github/scripts/Files-Pretendard-Setup.iss'
      - 'src/**'
      - 'Files.slnx'
      - 'global.json'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.Config'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      FONT_DIR: src/Files.App/Assets/Fonts
      APP_PROJECT: src/Files.App/Files.App.csproj
      PACKAGE_DIR: ${{ github.workspace }}\\artifacts\\AppxPackages\\
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate install helper syntax with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = '.github/scripts/Install-FilesDev-Package.ps1'
          $ps51 = "$env:SystemRoot\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
          $check = @'
          $parseErrors = $null
          $parseTokens = $null
          $target = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Install-FilesDev-Package.ps1'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($target, [ref]$parseTokens, [ref]$parseErrors)
          if ($null -eq $ast -or $parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check))
          & $ps51 -NoProfile -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'Installer PowerShell 5.1 syntax parse failed' }
          Write-Host 'Installer PowerShell script syntax validated.'
      - name: Download and SHA-verify official pinned Pretendard TTFs (workspace only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '7aeb0698819be2b4097dae8ec8fe6a795e5cf3ae'
          $base = "https://raw.githubusercontent.com/orioncactus/pretendard/$commit/packages/pretendard/dist/public/static/alternative"
          $fonts = [ordered]@{
            'Pretendard-Regular.ttf'  = '01147e9991c91198235e8deefe9c3145dfad8d2a'
            'Pretendard-Medium.ttf'   = '1db67c68fbd6922637bda59b917ae2d8721971c3'
            'Pretendard-SemiBold.ttf' = '9f2690f0979cfcbf1492fc3927536284e346d065'
            'Pretendard-Bold.ttf'     = 'fb07fc65e8e568c60dfd985fb6fcdfd114da4d64'
          }
          New-Item -ItemType Directory -Force -Path $env:FONT_DIR | Out-Null
          foreach ($font in $fonts.GetEnumerator()) {
            $dest = Join-Path $env:FONT_DIR $font.Key
            if (Test-Path -LiteralPath $dest) { throw "TTF unexpectedly present in checkout: $($font.Key)" }
            Invoke-WebRequest -Uri "$base/$($font.Key)" -OutFile $dest -TimeoutSec 180 -ErrorAction Stop
            $bytes = [System.IO.File]::ReadAllBytes($dest)
            if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 0 -or $bytes[1] -ne 1 -or $bytes[2] -ne 0 -or $bytes[3] -ne 0) {
              throw "Missing or malformed TrueType font: $($font.Key)"
            }
            $blob = (& git hash-object -- $dest).Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -ne $font.Value) {
              throw "Pinned Git blob SHA-1 mismatch for $($font.Key): expected $($font.Value), found $blob"
            }
            Write-Host "Verified $($font.Key) ($($bytes.Length) bytes, Git blob SHA-1 $blob)"
          }
          if (-not (Test-Path (Join-Path $env:FONT_DIR 'OFL.txt'))) { throw 'Pretendard SIL OFL notice is missing' }
          # These ignored downloads are never committed or pushed.
          if ((git status --porcelain --untracked-files=all | Out-String).Trim()) {
            throw 'Checkout contains unexpected tracked or unignored changes after font download'
          }
      - name: Set a unique increasing MSIX revision for each Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # FilesDev versions previously remained at 4.3.3.0 across distinct builds,
          # causing ERROR_PACKAGE_ALREADY_EXISTS (0x80073CFB) on user upgrades.
          $revision = [int]$env:GITHUB_RUN_NUMBER
          if ($revision -lt 1 -or $revision -gt 65535) { throw "MSIX revision is out of range: $revision" }
          $manifestPath = 'src/Files.App/Package.appxmanifest'
          $xml = [System.IO.File]::ReadAllText($manifestPath)
          $version = "4.3.3.$revision"
          $oldVersion = 'Version="4.3.3.0"'
          if ($xml.IndexOf($oldVersion, [System.StringComparison]::Ordinal) -lt 0) {
            throw 'Expected baseline FilesDev identity version 4.3.3.0 was not found'
          }
          $updated = $xml.Replace($oldVersion, ('Version="' + $version + '"'))
          if ($updated -eq $xml -or $updated -notmatch [regex]::Escape('Version="' + $version + '"')) {
            throw 'FilesDev package Identity version could not be updated'
          }
          [System.IO.File]::WriteAllText($manifestPath, $updated, (New-Object System.Text.UTF8Encoding($false)))
          "FILES_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "This build's FilesDev MSIX version: $version"
          # Changing the manifest is limited to this ephemeral checkout. No git push.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        shell: pwsh
        run: |
          msbuild Files.slnx -t:Restore -p:Platform=x64 -p:Configuration=Release -p:PublishReadyToRun=true -v:quiet
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
      - name: Generate temporary personal test signing certificate
        shell: pwsh
        run: |
          ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination (Join-Path $env:RUNNER_TEMP "FilesApp_SelfSigned.pfx")
      - name: Build and package Release x64 MSIX
        shell: pwsh
        run: |
          msbuild $env:APP_PROJECT -t:Build -p:Configuration=Release -p:Platform=x64 -p:AppxBundle=Never -p:GenerateAppxPackageOnBuild=true -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$env:PACKAGE_DIR" -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile="$(Join-Path $env:RUNNER_TEMP 'FilesApp_SelfSigned.pfx')" -p:PackageCertificatePassword="" -p:PackageCertificateThumbprint="" -v:quiet
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }
      - name: Verify Pretendard TTF and license entries inside final MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @(
            'Assets/Fonts/Pretendard-Regular.ttf',
            'Assets/Fonts/Pretendard-Medium.ttf',
            'Assets/Fonts/Pretendard-SemiBold.ttf',
            'Assets/Fonts/Pretendard-Bold.ttf',
            'Assets/Fonts/OFL.txt'
          )
          if (-not (Test-Path $env:PACKAGE_DIR)) { throw 'MSIX output directory does not exist' }
          $packages = @(Get-ChildItem -Path $env:PACKAGE_DIR -Recurse -File | Where-Object { $_.Extension -in @('.msix','.appx') })
          if ($packages.Count -eq 0) { throw 'No MSIX/AppX package available for payload inspection' }
          $matched = $false
          foreach ($package in $packages) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
              $missing = @($expected | Where-Object { $entries -notcontains $_ })
              if ($missing.Count -eq 0) {
                if ($entries -notcontains 'Files.exe') { throw "Files.exe missing inside the installable MSIX: $($package.Name)" }
                $matched = $true
                Write-Host "All four TTF fonts and OFL notice verified in package: $($package.FullName)"
                foreach ($name in $expected) {
                  $entry = $zip.Entries | Where-Object { $_.FullName.Replace('\','/') -eq $name } | Select-Object -First 1
                  if (-not $entry -or $entry.Length -lt 100) { throw "Empty packaged resource: $name" }
                  Write-Host "  $name : $($entry.Length) bytes"
                }
              } else {
                Write-Host "Package $($package.Name) missing fonts/license: $($missing -join ', ')"
              }
            } finally {
              $zip.Dispose()
            }
          }
          if (-not $matched) { throw 'No final MSIX/AppX package includes all required fonts and license' }
      - name: Prepare offline personal installer payload and export public signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'FilesApp_SelfSigned.pfx'
          $cer = Join-Path $env:PACKAGE_DIR 'FilesApp_SelfSigned.cer'
          if (-not (Test-Path $pfx)) { throw 'Temporary signing certificate is missing' }
          New-Item -ItemType Directory -Force -Path $env:PACKAGE_DIR | Out-Null
          $cert = Get-PfxCertificate -FilePath $pfx
          if (-not $cert) { throw 'Cannot read PFX certificate' }
          Export-Certificate -Cert $cert -FilePath $cer -Force | Out-Null
          if (-not (Test-Path $cer)) { throw 'Exported public certificate missing' }
          $app = @(Get-ChildItem -Path $env:PACKAGE_DIR -Recurse -File | Where-Object {
            $_.Extension -in @('.msix','.appx') -and $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if ($app.Count -ne 1) { throw "Expected one FilesDev app package, found $($app.Count)" }
          if ($app[0].Name -notmatch [regex]::Escape($env:FILES_PACKAGE_VERSION)) {
            throw "Output MSIX does not have expected upgrade version $env:FILES_PACKAGE_VERSION"
          }
          Write-Host "Main install package: $($app[0].Name), $($app[0].Length) bytes"
      - name: Smoke-test real FilesDev MSIX installation on Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The Inno installer invokes Windows PowerShell 5.1, not pwsh 7.
          # Test the exact runtime and script path used on the user's PC.
          & "$env:SystemRoot\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File '.github/scripts/Install-FilesDev-Package.ps1' -PackageRoot $env:PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) {
            $errorFile = Join-Path $env:PACKAGE_DIR 'FilesDev-install-error.txt'
            if (Test-Path $errorFile) { Get-Content -Raw $errorFile | Write-Host }
            throw "Real MSIX deployment test failed (exit $LASTEXITCODE)"
          }
          $installed = Get-AppxPackage -Name 'FilesDev' | Where-Object { $_.Publisher -like '*CN=Files*' }
          if (-not $installed) { throw 'Package installer returned success, but FilesDev was not registered' }
          Write-Host "Installed test FilesDev: $($installed.PackageFullName)"
          # A second invocation of the same downloaded setup must be a safe no-op,
          # not a 0x80073CFB "already installed" failure.
          & "$env:SystemRoot\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File '.github/scripts/Install-FilesDev-Package.ps1' -PackageRoot $env:PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw "Repeat installation idempotence test failed ($LASTEXITCODE)" }
          Write-Host 'Repeat installation completed as a safe no-op.'
      - name: Build one-click x64 offline installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'installer-output'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & $iscc "/DBuildOutput=$env:PACKAGE_DIR" "/DPackageVersion=$env:FILES_PACKAGE_VERSION" "/O$destination" '.github/scripts/Files-Pretendard-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Single-file installer compilation failed' }
          $installer = Join-Path $destination 'Files-Pretendard-Setup-x64.exe'
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 10MB) { throw 'Installer EXE missing or too small' }
          Write-Host "Installer EXE: $installer ($((Get-Item $installer).Length) bytes)"
      - name: Upload one-click Files Pretendard Windows setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Files-Pretendard-Setup-x64
          path: installer-output/Files-Pretendard-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload MSIX and dependency packages
        uses: actions/upload-artifact@v4
        with:
          name: Files-Pretendard-Release-x64
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 14
